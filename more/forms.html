<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="forms.css">
</head>
<body>
    <header>
        <h1>Accessible Forms</h1>
    </header>
    <main>
        <section>
            <h2>Form Example</h2>
            <form id="myform" method="post">
                <fieldset>
                    <legend>Give use your information!</legend>

                    <label for="Username">
                        Enter your name
                        <input type="text" id="username" required>
                    </label>

                    <label for="email">
                        Enter your email
                        <input type="email" id="email">
                    </label>

                    <label for="website">
                        Enter your website
                        <input type="url" id="website">
                    </label>

                    <label for="phone">
                        Enter your phone
                        <input type="tel" id="phone" minlength="7">
                    </label>

                    <label for="age">
                        Enter your age
                        <input type="number" id="age">
                    </label>

                    <label for="password">
                        what is your favorite password?
                        <input type="text" id="password" maxlength="20" minlength="5" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+!=]).*" required>
                    </label>

                    <ul class="inputRequirements">
                        <li>must be at least 5 characters and contain uppercase, lowercase, number and symbol</li>
                    </ul>
                    
                    <input type="submit">
                </fieldset>
            </form>
        </section>
    </main>
</body>
</html>
